<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¿Qué hora es? — Teacher clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#14284B; --muted:#55657F; --line:#D3DCEA;
  --cobalt:#1D4E89; --on-cobalt:#FFFFFF; --saffron:#F2B705; --on-saffron:#2A1E00;
  --mint:#2E9A87; --face:#FFFDF5; --face-ink:#14284B; --tile-a:#1D4E89; --tile-b:#F2B705; --tile-c:#2E9A87;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E192C; --surface:#172540; --ink:#EAF0FA; --muted:#A3B4CE; --line:#2A3C5D;
    --cobalt:#86AEE6; --on-cobalt:#0E192C; --saffron:#F5C842; --on-saffron:#2A1E00;
    --mint:#5CC9B5; --face:#F7F2E3; --face-ink:#14284B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E192C; --surface:#172540; --ink:#EAF0FA; --muted:#A3B4CE; --line:#2A3C5D;
  --cobalt:#86AEE6; --on-cobalt:#0E192C; --saffron:#F5C842; --on-saffron:#2A1E00;
  --mint:#5CC9B5; --face:#F7F2E3; --face-ink:#14284B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:1.125rem; line-height:1.5}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--saffron); outline-offset:3px}

header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; padding:1rem clamp(1rem,3vw,2.5rem); border-bottom:2px solid var(--line)}
h1{font-family:var(--display); font-weight:800; font-size:clamp(1.8rem,3.5vw,2.6rem); margin:0; line-height:1}
.tabs{display:flex; gap:.5rem; background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:.3rem}
.tab{border:0; background:transparent; padding:.55rem 1.2rem; border-radius:999px; font-weight:700}
.tab[aria-selected="true"]{background:var(--cobalt); color:var(--on-cobalt)}
.toggle{display:flex; align-items:center; gap:.5rem; font-weight:700; color:var(--muted)}
.toggle input{width:1.3rem; height:1.3rem; accent-color:var(--cobalt)}

main{max-width:1200px; margin:0 auto; padding:clamp(1rem,3vw,2.5rem)}
.stage{display:grid; grid-template-columns:minmax(280px,1fr) minmax(300px,1fr); gap:clamp(1.5rem,4vw,3.5rem); align-items:center}
@media (max-width:820px){ .stage{grid-template-columns:1fr} }
.clock-wrap{display:flex; justify-content:center}
.clock-wrap svg{width:min(100%,460px); height:auto; display:block}

.hand-hour{transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.spin .hand-hour{transition:transform 1.6s cubic-bezier(.2,.8,.25,1)}
@media (prefers-reduced-motion:reduce){ .hand-hour,.spin .hand-hour{transition:none} }

.question{font-family:var(--display); font-weight:800; font-size:clamp(2rem,4vw,3rem); margin:0 0 .75rem; line-height:1.1}
.sentence{display:inline-flex; flex-wrap:wrap; gap:.4em; font-family:var(--display); font-weight:800; font-size:clamp(2.4rem,6vw,4.4rem); line-height:1.05; margin:0}
.chip{padding:.05em .3em; border-radius:.25em}
.chip.una{background:var(--saffron); color:var(--on-saffron)}
.chip.las{background:var(--cobalt); color:var(--on-cobalt)}
.num{text-decoration:underline; text-decoration-thickness:.08em; text-underline-offset:.12em}
.english{color:var(--muted); font-size:1.35rem; margin:.6rem 0 0; min-height:2rem}
.q-en{margin:-.5rem 0 1rem; min-height:0}
.btn small{font-weight:400; opacity:.85}
.hide-en .english{visibility:hidden}

.rule{margin:1.5rem 0 0; padding:1rem 1.2rem; background:var(--surface); border:2px solid var(--line); border-radius:14px; font-size:1.05rem}
.rule p{margin:.2rem 0}
.rule b.una{color:var(--ink); background:var(--saffron); color:var(--on-saffron); padding:0 .25em; border-radius:4px}
.rule b.las{background:var(--cobalt); color:var(--on-cobalt); padding:0 .25em; border-radius:4px}

.hours{display:grid; grid-template-columns:repeat(6,1fr); gap:.6rem; margin-top:1.5rem}
@media (max-width:480px){ .hours{grid-template-columns:repeat(4,1fr)} }
.hour-btn{border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:.7rem 0; font-family:var(--display); font-weight:800; font-size:1.6rem}
.hour-btn[aria-pressed="true"]{background:var(--cobalt); border-color:var(--cobalt); color:var(--on-cobalt)}
.hour-btn.one{border-color:var(--saffron)}
.hour-btn.one[aria-pressed="true"]{background:var(--saffron); color:var(--on-saffron)}

.actions{display:flex; flex-wrap:wrap; gap:.75rem; margin-top:1.5rem}
.btn{border:0; border-radius:14px; padding:.85rem 1.4rem; font-weight:700; font-size:1.15rem; display:inline-flex; align-items:center; gap:.5rem}
.btn.primary{background:var(--cobalt); color:var(--on-cobalt)}
.btn.secondary{background:var(--surface); border:2px solid var(--line)}
.btn.accent{background:var(--saffron); color:var(--on-saffron)}
.btn:disabled{opacity:.45; cursor:not-allowed}
kbd{font-family:var(--body); font-size:.8em; border:1.5px solid currentColor; border-radius:5px; padding:0 .35em; opacity:.75}

.mode-switch{display:flex; gap:.5rem; margin-bottom:1.25rem}
.listen-card{width:min(100%,460px); aspect-ratio:1; border-radius:50%; border:6px dashed var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; background:var(--surface)}
.listen-card button{border:0; background:var(--cobalt); color:var(--on-cobalt); width:40%; aspect-ratio:1; border-radius:50%; font-size:clamp(2.5rem,6vw,4rem)}
.listen-card span{color:var(--muted); font-weight:700}
.answer{min-height:9rem}
.answer.hidden .sentence,.answer.hidden .english{visibility:hidden}
.voice-note{color:var(--muted); font-size:.95rem; margin-top:1rem}
[hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <h1>¿Qué hora es?</h1>
  <div class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" role="tab" id="tab-explore" aria-selected="true">Explorar (Explore)</button>
    <button class="tab" role="tab" id="tab-practice" aria-selected="false">Practicar (Practice)</button>
  </div>
  <label class="toggle"><input type="checkbox" id="en-toggle" checked> Show English</label>
</header>

<main id="main">
  <!-- EXPLORE -->
  <section id="view-explore" class="stage">
    <div class="clock-wrap" id="clock-explore"></div>
    <div>
      <p class="question">¿Qué hora es?</p>
      <p class="english q-en">What time is it?</p>
      <p class="sentence" id="ex-sentence"></p>
      <p class="english" id="ex-english"></p>
      <div class="actions">
        <button class="btn primary" id="ex-speak">🔊 Escuchar <small>(Listen)</small></button>
      </div>
      <div class="hours" id="hours" role="group" aria-label="Choose an hour"></div>
      <div class="rule">
        <p><b class="una">Es la</b> una → only for 1:00</p>
        <p><b class="las">Son las</b> + number → 2:00 to 12:00</p>
      </div>
    </div>
  </section>

  <!-- PRACTICE -->
  <section id="view-practice" class="stage" hidden>
    <div class="clock-wrap" id="pr-visual">
      <div id="clock-practice"></div>
      <div class="listen-card" id="listen-card" hidden>
        <button id="pr-play" aria-label="Play the time">🔊</button>
        <span>Escucha (Listen)</span>
      </div>
    </div>
    <div>
      <div class="mode-switch" role="group" aria-label="Practice type">
        <button class="btn secondary" id="mode-look" aria-pressed="true">👀 Mira <small>(Look)</small></button>
        <button class="btn secondary" id="mode-listen" aria-pressed="false">👂 Escucha <small>(Listen)</small></button>
      </div>
      <p class="question">¿Qué hora es?</p>
      <p class="english q-en">What time is it?</p>
      <div class="answer hidden" id="pr-answer">
        <p class="sentence" id="pr-sentence"></p>
        <p class="english" id="pr-english"></p>
      </div>
      <div class="actions">
        <button class="btn accent" id="pr-reveal">Mostrar respuesta <small>(Show answer)</small> <kbd>Enter</kbd></button>
        <button class="btn primary" id="pr-next">Nueva hora <small>(New time)</small> <kbd>Space</kbd></button>
        <button class="btn secondary" id="pr-ask">🔊 Pregunta <small>(Ask)</small></button>
      </div>
      <p class="voice-note" id="voice-note" hidden>No Spanish voice found on this computer, so audio may sound off. Read the sentence aloud yourself.</p>
    </div>
  </section>
</main>

<script>
const NUM = ["","una","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce"];
const EN  = ["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const sentenceText = h => h === 1 ? "Es la una." : `Son las ${NUM[h]}.`;
const englishText = h => `It’s ${EN[h]} o’clock.`;
const sentenceHTML = h => h === 1
  ? `<span class="chip una">Es la</span><span class="num">una</span>.`
  : `<span class="chip las">Son las</span><span class="num">${NUM[h]}</span>.`;

/* ---------- Clock ---------- */
function makeClock(id){
  const C = 200, R = 180;
  let rim = "";
  const tiles = ["var(--tile-a)","var(--tile-b)","var(--tile-c)"];
  for(let i=0;i<36;i++){
    const a = i*10*Math.PI/180;
    rim += `<circle cx="${C+Math.sin(a)*R}" cy="${C-Math.cos(a)*R}" r="${i%3===0?9:6}" fill="${tiles[i%3]}"/>`;
  }
  let nums = "", ticks = "";
  for(let h=1;h<=12;h++){
    const a = h*30*Math.PI/180;
    nums += `<text x="${C+Math.sin(a)*128}" y="${C-Math.cos(a)*128}" text-anchor="middle" dominant-baseline="central" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" font-size="40" fill="var(--face-ink)">${h}</text>`;
    ticks += `<line x1="${C+Math.sin(a)*152}" y1="${C-Math.cos(a)*152}" x2="${C+Math.sin(a)*162}" y2="${C-Math.cos(a)*162}" stroke="var(--face-ink)" stroke-width="5" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 400 400" role="img" aria-label="Clock" id="${id}">
    <circle cx="${C}" cy="${C}" r="196" fill="var(--surface)" stroke="var(--line)" stroke-width="4"/>
    ${rim}
    <circle cx="${C}" cy="${C}" r="168" fill="var(--face)"/>
    ${ticks}${nums}
    <g class="hand-min"><line x1="${C}" y1="${C+18}" x2="${C}" y2="${C-150}" stroke="#7C8AA3" stroke-width="7" stroke-linecap="round"/></g>
    <g class="hand-hour" style="transform-origin:${C}px ${C}px;transform:rotate(0deg)">
      <line x1="${C}" y1="${C+16}" x2="${C}" y2="${C-92}" stroke="#1D4E89" stroke-width="16" stroke-linecap="round"/>
      <circle cx="${C}" cy="${C-92}" r="11" fill="#F2B705" stroke="#1D4E89" stroke-width="4"/>
    </g>
    <circle cx="${C}" cy="${C}" r="12" fill="#14284B"/>
  </svg>`;
}
function setHand(svg, deg){ svg.querySelector(".hand-hour").style.transform = `rotate(${deg}deg)`; }

/* Forward-only rotation so the hand always moves clockwise */
function nextAngle(current, hour, extraTurns=0){
  const target = (hour%12)*30;
  let base = current - (current % 360);
  let a = base + target;
  if(a <= current) a += 360;
  return a + extraTurns*360;
}

/* ---------- Speech ---------- */
let esVoice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices();
  esVoice = v.find(x=>/^es[-_](MX|US)/i.test(x.lang)) || v.find(x=>/^es/i.test(x.lang)) || null;
  document.getElementById("voice-note").hidden = true;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function tts(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = esVoice ? esVoice.lang : "es-MX";
  if(esVoice) u.voice = esVoice;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}

/* ---------- English toggle ---------- */
const enToggle = document.getElementById("en-toggle");
enToggle.addEventListener("change", ()=> document.body.classList.toggle("hide-en", !enToggle.checked));

/* ---------- Explore ---------- */
document.getElementById("clock-explore").innerHTML = makeClock("svg-ex");
const svgEx = document.getElementById("svg-ex");
let exHour = 1, exAngle = 0;
const hoursEl = document.getElementById("hours");
for(let h=1;h<=12;h++){
  const b = document.createElement("button");
  b.className = "hour-btn" + (h===1?" one":"");
  b.textContent = h;
  b.setAttribute("aria-pressed","false");
  b.setAttribute("aria-label", `${h} o’clock`);
  b.addEventListener("click", ()=> showExplore(h, true));
  hoursEl.appendChild(b);
}
function showExplore(h, talk){
  exHour = h;
  exAngle = nextAngle(exAngle, h);
  setHand(svgEx, exAngle);
  document.getElementById("ex-sentence").innerHTML = sentenceHTML(h);
  document.getElementById("ex-english").textContent = englishText(h);
  [...hoursEl.children].forEach((b,i)=> b.setAttribute("aria-pressed", String(i+1===h)));
  if(talk) speak(sentenceText(h));
}
document.getElementById("ex-speak").addEventListener("click", ()=> speak(sentenceText(exHour)));
showExplore(1, false);

/* ---------- Practice ---------- */
document.getElementById("clock-practice").innerHTML = makeClock("svg-pr");
const svgPr = document.getElementById("svg-pr");
const answerEl = document.getElementById("pr-answer");
let prHour = 3, prAngle = 0, mode = "look";

function newHour(){
  let h;
  do { h = 1 + Math.floor(Math.random()*12); } while(h === prHour);
  prHour = h;
  answerEl.classList.add("hidden");
  document.getElementById("pr-sentence").innerHTML = sentenceHTML(h);
  document.getElementById("pr-english").textContent = englishText(h);
  if(mode === "look"){
    svgPr.parentElement.classList.add("spin");
    prAngle = nextAngle(prAngle, h, 1);
    setHand(svgPr, prAngle);
  } else {
    prAngle = nextAngle(prAngle, h);
    setHand(svgPr, prAngle);
    speak(sentenceText(h));
  }
}
function reveal(){
  answerEl.classList.remove("hidden");
  if(mode === "listen"){
    document.getElementById("clock-practice").hidden = false;
    document.getElementById("listen-card").hidden = true;
  }
  speak(sentenceText(prHour));
}
function setMode(m){
  mode = m;
  document.getElementById("mode-look").setAttribute("aria-pressed", String(m==="look"));
  document.getElementById("mode-listen").setAttribute("aria-pressed", String(m==="listen"));
  document.getElementById("clock-practice").hidden = (m==="listen");
  document.getElementById("listen-card").hidden = (m!=="listen");
  answerEl.classList.add("hidden");
}
function prepNext(){
  if(mode === "listen"){
    document.getElementById("clock-practice").hidden = true;
    document.getElementById("listen-card").hidden = false;
  }
  newHour();
}
document.getElementById("mode-look").addEventListener("click", ()=>{ setMode("look"); });
document.getElementById("mode-listen").addEventListener("click", ()=>{ setMode("listen"); });
document.getElementById("pr-next").addEventListener("click", prepNext);
document.getElementById("pr-reveal").addEventListener("click", reveal);
document.getElementById("pr-ask").addEventListener("click", ()=> speak("¿Qué hora es?"));
document.getElementById("pr-play").addEventListener("click", ()=> speak(sentenceText(prHour)));
document.getElementById("pr-sentence").innerHTML = sentenceHTML(prHour);
document.getElementById("pr-english").textContent = englishText(prHour);
prAngle = nextAngle(0, prHour); setHand(svgPr, prAngle);

/* ---------- Tabs & keys ---------- */
function showView(v){
  document.getElementById("view-explore").hidden = v!=="explore";
  document.getElementById("view-practice").hidden = v!=="practice";
  document.getElementById("tab-explore").setAttribute("aria-selected", String(v==="explore"));
  document.getElementById("tab-practice").setAttribute("aria-selected", String(v==="practice"));
}
document.getElementById("tab-explore").addEventListener("click", ()=> showView("explore"));
document.getElementById("tab-practice").addEventListener("click", ()=> showView("practice"));
document.addEventListener("keydown", e=>{
  if(document.getElementById("view-practice").hidden) return;
  if(e.target.tagName === "INPUT") return;
  if(e.code === "Space"){ e.preventDefault(); prepNext(); }
  if(e.code === "Enter" && e.target.tagName !== "BUTTON"){ e.preventDefault(); reveal(); }
});

function clipKey(t){
  if(t === "¿Qué hora es?") return "q";
  for(let h=1; h<=12; h++) if(sentenceText(h) === t) return String(h);
  return null;
}
let currentAudio = null;
function speak(t){
  const k = clipKey(t);
  if(k && CLIPS[k]){
    try{
      if("speechSynthesis" in window) speechSynthesis.cancel();
      if(currentAudio){ currentAudio.pause(); }
      currentAudio = new Audio(CLIPS[k]);
      currentAudio.play().catch(()=> tts(t));
      return;
    }catch(e){}
  }
  tts(t);
}
