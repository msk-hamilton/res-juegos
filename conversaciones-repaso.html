<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversaciones en español: Repaso</title>
<!-- Ocean animal pictures use the same "img" folder as ¿Qué hay en el océano? (el-tiburon, el-delfin, el-pulpo, la-medusa, la-ballena). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#fbf3e4; --card:#fffaf2; --ink:#2b1b3d; --muted:#6b5a70; --line:#eadbc4;
  --rosa:#c81d6b; --rosa-soft:#fbe3ee; --mari:#f2a516; --mari-soft:#fff0cc; --turq:#0f7f80; --turq-soft:#dcf1f0;
  --mora:#7a3fa0; --mora-soft:#efe4f6;
  --face:#ffffff; --ok:#1d7f48; --ok-soft:#e1f3e8; --no:#b4520f; --no-soft:#fdebdd; --on-accent:#fffaf2;
  --shadow:0 2px 0 rgba(43,27,61,.06),0 10px 24px -14px rgba(43,27,61,.45);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1228; --card:#271a36; --ink:#f6ecdc; --muted:#c2b1c8; --line:#3d2b50;
  --rosa:#ff5fa2; --rosa-soft:#4a1d36; --mari:#f2a516; --mari-soft:#3e3014; --turq:#46c2c3; --turq-soft:#17393c;
  --mora:#c79be6; --mora-soft:#33204a;
  --face:#2f2142; --ok:#62d394; --ok-soft:#163626; --no:#ffac6e; --no-soft:#3e2616; --on-accent:#1c1228;
  --shadow:0 10px 24px -14px rgba(0,0,0,.8); color-scheme:dark;}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--mari);outline-offset:3px}
.lilita{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400}
.picado{height:52px;background:repeating-linear-gradient(90deg,var(--rosa) 0 84px,transparent 84px 96px,var(--mari) 96px 180px,transparent 180px 192px,var(--turq) 192px 276px,transparent 276px 288px,#7a3fa0 288px 372px,transparent 372px 384px);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.wrap{max-width:1000px;margin:0 auto;padding:16px 18px 48px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin:6px 0 22px}
h1{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;font-size:2.4rem;line-height:1.05;margin:0}
h2{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;font-size:1.8rem;line-height:1.1;margin:0 0 10px}
.sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
nav{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:16px;box-shadow:var(--shadow);flex-wrap:wrap}
nav button{border:0;background:transparent;padding:10px 16px;border-radius:12px;font-weight:500;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--rosa);color:var(--on-accent)}
nav small{display:block;font-size:.68rem;font-weight:400;opacity:.85;line-height:1}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:24px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:2px solid var(--line);background:var(--card);padding:11px 20px;border-radius:999px;font-weight:600;min-height:48px}
.btn:hover{border-color:var(--rosa)}
.btn.main{background:var(--rosa);border-color:var(--rosa);color:var(--on-accent)}
.btn.turq{background:var(--turq);border-color:var(--turq);color:var(--on-accent)}
.btn[hidden]{display:none}
.en{font-weight:400;opacity:.8;font-size:.85em}
.note{color:var(--muted);font-size:.9rem}
.center{text-align:center}

/* number word colors: tens = rosa, y = muted, ones = turquesa */
.w-t{color:var(--rosa)}.w-y{color:var(--muted)}.w-u{color:var(--turq)}


/* pictures */
.pic{display:grid;place-items:center;width:100%;aspect-ratio:1}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic .emo{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1;display:grid;place-items:center;width:86%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.55)}

/* QUESTIONS */
.prompt{font-family:"Lilita One","Trebuchet MS",sans-serif;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.15;margin:0 0 6px;text-align:center}
.inst{text-align:center;color:var(--muted);margin:0 0 14px}
.qpic{max-width:230px;margin:0 auto 16px;background:linear-gradient(#bfeef0,#5cc4cf);border-radius:28px;padding:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;margin:0 auto 16px;background:linear-gradient(#bfeef0,#3aa9bb);border-radius:28px;padding:14px}
.show{font-family:"Lilita One","Trebuchet MS",sans-serif;text-align:center;line-height:1.15;margin:0 auto 18px;max-width:560px;
  background:var(--face);border-radius:24px;padding:18px 14px;box-shadow:inset 0 0 0 4px var(--line);font-size:clamp(2rem,6vw,3.2rem)}
.listen{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 0 18px}
.listen .btn.turq{font-size:1.3rem;padding:18px 34px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:6px 0 8px}
.choice{position:relative;border:3px solid var(--line);background:var(--face);border-radius:20px;padding:16px 14px;min-height:84px;
  font-family:"Lexend",system-ui,sans-serif;font-weight:600;font-size:clamp(1.15rem,2.8vw,1.5rem);line-height:1.2;display:flex;align-items:center;gap:12px;text-align:left}
.choice.picc{flex-direction:column;justify-content:center;padding:12px}
.choice.picc .pic{max-width:170px;background:linear-gradient(#dff6f7,#a9e2e8);border-radius:18px}
.choice.picc .k{position:absolute;top:10px;left:10px}
.choice.picc .mark{position:absolute;top:8px;right:12px}
.choice .k{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--line);font-size:.95rem;font-weight:600;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--rosa)}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.choice.no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.choice .mark{margin-left:auto;font-size:1.3rem;font-weight:700}
.feedback{min-height:1.6em;font-weight:600;font-size:1.1rem;margin:10px 0;text-align:center}
.feedback.ok{color:var(--ok)}.feedback.no{color:var(--no)}
.say{display:none;margin:8px auto 0;background:var(--turq-soft);border-radius:18px;padding:12px 18px;text-align:center;max-width:620px}
.say.on{display:block}
.say p{margin:0}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.navrow .right{display:flex;gap:10px;margin-left:auto}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--mari)}.dot.done{background:var(--turq)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.count{font-weight:600;color:var(--muted)}
.minibtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.95rem;min-height:44px}
.minibtn:hover{border-color:var(--turq)}

/* START / RESULT */
.start,.result{max-width:600px;margin:0 auto;text-align:center}
.start input{width:100%;border:2px solid var(--line);background:var(--face);border-radius:14px;padding:12px 16px;margin:10px 0 18px;font-size:1.1rem;text-align:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 6px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{border:3px solid var(--line);background:var(--face);border-radius:20px;padding:16px;text-align:center}
.mode:hover{border-color:var(--rosa)}
.mode b{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;font-size:1.5rem;display:block;line-height:1.15}
.mode span{color:var(--muted);font-size:.95rem}
.mode.full{border-color:var(--rosa)}
.summary{background:var(--face);border-radius:20px;box-shadow:inset 0 0 0 3px var(--line);padding:16px 20px;text-align:left;margin:16px 0}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.summary dt{color:var(--muted)}.summary dd{margin:0;font-weight:600}
.big{font-family:"Lilita One","Trebuchet MS",sans-serif;font-size:2.4rem;line-height:1.1;color:var(--rosa);margin:6px 0}
#copyBox{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:.95rem;background:var(--face);color:var(--ink);margin-top:10px}

/* VOCABULARIO */
.rulebox{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media (max-width:760px){.rulebox{grid-template-columns:1fr}}
.rule{border-radius:20px;padding:16px 20px;border-top:10px solid var(--rosa);background:var(--card);box-shadow:var(--shadow)}
.rule:nth-child(2){border-top-color:var(--turq)}.rule:nth-child(3){border-top-color:var(--mari)}
.rule .tag{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.rule b{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;font-size:1.5rem;display:block;line-height:1.2;margin:4px 0}
.rule > span{color:var(--muted);font-size:.95rem}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.vcard{border:2px solid var(--line);background:var(--face);border-radius:20px;padding:12px;text-align:center}
.vcard:hover{border-color:var(--turq)}
.vcard .pic{max-width:120px;margin:0 auto;background:linear-gradient(#dff6f7,#a9e2e8);border-radius:18px}
.vcard b{display:block;font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;font-size:1.35rem;margin-top:6px}
.vcard span{display:block;color:var(--muted);font-size:.9rem}
.vcard i{display:block;font-style:normal;font-size:.95rem;margin-top:4px}
.art{color:var(--rosa)}
dialog{border:0;border-radius:24px;padding:0;max-width:min(960px,94vw);width:100%;max-height:90vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(28,18,40,.55)}
.dlghead{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:16px 20px;z-index:1;border-bottom:2px solid var(--line)}
.dlgbody{padding:16px 20px 22px}

.art{color:var(--rosa)}.poss{color:var(--turq)}
.scene{max-width:680px;margin:0 auto 16px;background:var(--face);border-radius:24px;box-shadow:inset 0 0 0 4px var(--line);padding:14px 16px}
.place{display:inline-block;background:var(--mora-soft);color:var(--mora);font-weight:600;font-size:.85rem;border-radius:999px;padding:3px 12px;margin-bottom:8px}
.place .en{color:var(--muted)}
.chat{display:grid;gap:10px}
.bub{border-radius:18px;padding:10px 16px;max-width:92%;font-size:1.25rem;line-height:1.3}
.bub b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;opacity:.75}
.bub.f{background:var(--mari-soft);justify-self:start}
.bub.f .line{font-family:"Lilita One","Trebuchet MS",sans-serif;font-size:1.6rem}
.bub.yo{background:var(--turq-soft);justify-self:end;text-align:right}
.visual{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.visual .pic{width:110px}
.visual.small .pic{width:80px}
.dclock{border-radius:22px;background:#22152f;padding:14px 20px 10px;box-shadow:inset 0 0 0 5px #3d2b50;text-align:center;color:#ffd166;min-width:220px}
.dclock .t{font-family:"Lexend",monospace;font-variant-numeric:tabular-nums;font-weight:600;font-size:3.2rem;line-height:1}
.dclock .ap{font-weight:600;font-size:1.1rem;margin-left:.3em;color:#ff9ec7}
.choice .dclock{min-width:0;width:100%;padding:10px}
.choice .dclock .t{font-size:2.2rem}
.choice.clk{padding:10px}
.tag{position:relative;display:inline-grid;place-items:center;background:#fff0cc;color:#2b1b3d;border:3px solid #f2a516;border-radius:10px 22px 22px 10px;padding:6px 18px 6px 26px;font-family:"Lilita One","Trebuchet MS",sans-serif;font-size:2rem;line-height:1}
.tag::before{content:"";position:absolute;left:8px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--face);box-shadow:inset 0 0 0 2px #f2a516}
.numcard{font-family:"Lilita One","Trebuchet MS",sans-serif;font-size:5rem;line-height:1;color:var(--rosa);background:var(--bg);border-radius:20px;padding:10px 30px}
.sea{border-radius:18px;padding:10px 18px;font-size:3rem;line-height:1.1}
.sea.verano{background:linear-gradient(160deg,#fff2bf,#ffd28a)}.sea.invierno{background:linear-gradient(160deg,#eef6ff,#bcdcf2)}
.sea.otono{background:linear-gradient(160deg,#ffe2c4,#f2b27a)}.sea.primavera{background:linear-gradient(160deg,#fde3ef,#d8f1cf)}
.mini-baskets{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mb{border-radius:18px;padding:8px 10px;background:var(--bg)}
.mb.mine{box-shadow:inset 0 0 0 3px var(--turq)}.mb.yours{box-shadow:inset 0 0 0 3px var(--mari)}
.mb h4{margin:0 0 4px;font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;font-size:1.2rem}
.mb .row{display:flex;gap:4px}.mb .pic{width:56px}
.dialog{text-align:left;max-width:560px;margin:0 auto}
.dialog p{margin:4px 0;font-size:1.25rem}
.dialog b{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;border-top:10px solid var(--rosa)}
.tcard:nth-child(2){border-top-color:var(--mari)}.tcard:nth-child(3){border-top-color:var(--turq)}.tcard:nth-child(4){border-top-color:var(--mora)}
.tcard:nth-child(5){border-top-color:var(--rosa)}.tcard:nth-child(6){border-top-color:var(--mari)}.tcard:nth-child(7){border-top-color:var(--turq)}
.tcard h3{margin:0 0 6px;font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;font-size:1.4rem}
.tcard p{margin:4px 0}
.tcard .ex{font-family:"Lilita One","Trebuchet MS",sans-serif;font-size:1.2rem}
.tcard a{color:var(--turq);font-weight:600;font-size:.9rem}
</style>
</head>
<body>
<div class="picado" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <h1>Conversaciones en español</h1>
      <p class="sub">Quarter 2 review: short conversations</p>
    </div>
    <nav role="tablist" aria-label="Lesson parts">
      <button role="tab" data-view="practicar" aria-selected="true">1. Practicar<small>Practice</small></button>
      <button role="tab" data-view="jugar" aria-selected="false">2. El desafío<small>Challenge</small></button>
      <button role="tab" data-view="ayuda" aria-selected="false">Ayuda<small>Reference</small></button>
    </nav>
  </header>
  <section class="view on" id="v-practicar">
    <div class="card" id="practice"></div>
    <p class="note" style="margin-top:14px">Teacher tip: read the friend’s line together, then students pick a reply (A, B, or C, or type it in the chat). After the right answer, two students read the conversation out loud.</p>
  </section>
  <section class="view" id="v-jugar">
    <div class="card" id="game"></div>
  </section>
  <section class="view" id="v-ayuda">
    <div class="topics" id="helpMain"></div>
  </section>
</div>

<dialog id="helpDlg" aria-labelledby="dlgTitle">
  <div class="dlghead"><h2 id="dlgTitle" style="margin:0">Ayuda</h2><button class="btn" id="dlgClose">Cerrar <span class="en">Close</span></button></div>
  <div class="dlgbody"><div class="topics" id="helpDlgBody"></div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const F1='Sofía',F2='Mateo';

/* ---------- pictures ---------- */
const EMO={'el-sandwich':'🥪','la-manzana':'🍎','el-agua':'💧','la-empanada':'🥟','el-mango':'🥭','la-soda':'🥤','la-pina':'🍍','la-ensalada':'🥗',
  'el-gato':'🐱','el-perro':'🐶','la-tortuga':'🐢','el-conejo':'🐰','el-tiburon':'🦈','el-delfin':'🐬','el-pulpo':'🐙','la-medusa':'🪼','la-ballena':'🐋'};
function pic(id){
  const src=window.IMG[id]||`img/${id}.webp`;
  return `<div class="pic"><img src="${src}" alt="" data-id="${id}" data-try="${window.IMG[id]?'e':'0'}"></div>`;
}
document.addEventListener('error',e=>{
  const im=e.target;if(!(im instanceof HTMLImageElement)||!im.dataset.id)return;
  if(im.dataset.try==='0'){im.dataset.try='1';im.src=`img/${im.dataset.id}.png`;return;}
  const s=document.createElement('span');s.className='emo';s.setAttribute('aria-hidden','true');s.textContent=EMO[im.dataset.id]||'?';im.replaceWith(s);
},true);

/* ---------- language helpers ---------- */
const ONES=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const TENS={3:'treinta',4:'cuarenta',5:'cincuenta'};
const num=n=>n<30?ONES[n]:(n%10?`${TENS[Math.floor(n/10)]} y ${ONES[n%10]}`:TENS[n/10]);
// time (same wording as ¿Qué hora es?)
const H=['','una','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once'];
const MW={0:'',5:'cinco',10:'diez',15:'quince',20:'veinte',25:'veinticinco',30:'treinta',35:'treinta y cinco',40:'cuarenta',45:'cuarenta y cinco',50:'cincuenta'};
const partOf=t=>!t.pm?'mañana':t.h<=7?'tarde':'noche';
const timeES=t=>`${t.h===1?'Es la':'Son las'} ${H[t.h]}${t.m?' y '+MW[t.m]:''} de la ${partOf(t)}.`;
const digits=t=>`${t.h}:${String(t.m).padStart(2,'0')}`;
const clock=t=>`<div class="dclock" role="img" aria-label="Clock ${digits(t)} ${t.pm?'p.m.':'a.m.'}"><div class="t">${digits(t)}<span class="ap">${t.pm?'p.&nbsp;m.':'a.&nbsp;m.'}</span></div></div>`;
function randTime(){const pm=Math.random()<.6;const h=pm?1+rnd(10):6+rnd(6);return {h,pm,m:pick([0,10,15,20,30,45])};}
// foods (from La tienda / picnic)
const FOOD=[{id:'el-sandwich',art:'el',ind:'un',w:'sándwich'},{id:'la-manzana',art:'la',ind:'una',w:'manzana'},{id:'la-empanada',art:'la',ind:'una',w:'empanada'},
  {id:'el-mango',art:'el',ind:'un',w:'mango'},{id:'la-soda',art:'la',ind:'una',w:'soda'},{id:'la-pina',art:'la',ind:'una',w:'piña'},{id:'la-ensalada',art:'la',ind:'una',w:'ensalada'}];
const PETS=[{id:'el-gato',un:'un',s:'gato',p:'gatos',f:false},{id:'el-perro',un:'un',s:'perro',p:'perros',f:false},{id:'la-tortuga',un:'una',s:'tortuga',p:'tortugas',f:true},{id:'el-conejo',un:'un',s:'conejo',p:'conejos',f:false}];
const SEA=[{id:'el-tiburon',un:'un',s:'tiburón',p:'tiburones'},{id:'el-delfin',un:'un',s:'delfín',p:'delfines'},{id:'el-pulpo',un:'un',s:'pulpo',p:'pulpos'},{id:'la-medusa',un:'una',s:'medusa',p:'medusas'},{id:'la-ballena',un:'una',s:'ballena',p:'ballenas'}];
const W=['','uno','dos','tres','cuatro','cinco','seis'];
const SEAS=[{id:'primavera',art:'la',w:'primavera',emo:'🌸🌷'},{id:'verano',art:'el',w:'verano',emo:'☀️🏖️'},{id:'otono',art:'el',w:'otoño',emo:'🍂🍁'},{id:'invierno',art:'el',w:'invierno',emo:'❄️⛄'}];
const prices=()=>shuffle([22,23,24,25,26,27,28,29,32,33,34,35,36,37,38,42,43,44,45,46,47,48]); // no 21/31/41 (veintiún rule)

/* ---------- speech ---------- */
let esVoice=null,aud=null;
function findVoice(){try{const v=speechSynthesis.getVoices();esVoice=v.find(x=>/^es[-_](MX|US)/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null;}catch(e){}}
if('speechSynthesis' in window){findVoice();speechSynthesis.addEventListener('voiceschanged',findVoice);}
const canSpeak=()=>!!Object.keys(window.AU).length||!!esVoice;
function speak(text){
  try{
    if(window.AU[text]){if(aud)aud.pause();aud=new Audio(window.AU[text]);aud.play().catch(()=>{});return;}
    if(!esVoice)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=esVoice;u.lang=esVoice.lang;u.rate=.85;speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- tabs ---------- */
const VIEWS=['practicar','jugar','ayuda'];
const tabs=[...document.querySelectorAll('nav button')];
let current='practicar';
function show(v){
  if(!VIEWS.includes(v))v='practicar';current=v;
  tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
}
tabs.forEach(b=>b.addEventListener('click',()=>{show(b.dataset.view);history.replaceState(null,'','#'+b.dataset.view);}));
show((location.hash||'').slice(1));

const dlg=$('helpDlg');
function openHelp(){if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');}
$('dlgClose').onclick=()=>{if(dlg.close)dlg.close();else dlg.removeAttribute('open');};

/* ---------- conversation builder ---------- */
// sc = {place, placeEn, who, line, visual, inst, opts, correct, hint, reply}
function sceneHTML(sc){
  return `<div class="scene"><span class="place">📍 ${sc.place} <span class="en">${sc.placeEn}</span></span>
    <div class="chat"><div class="bub f"><b>${sc.who}</b><span class="line">${esc(sc.line)}</span></div></div>
    ${sc.visual?`<div class="visual ${sc.vclass||''}">${sc.visual}</div>`:''}</div>`;
}
function Q(sc){
  return {prompt:sc.prompt||'¿Qué dices?',inst:sc.inst,top:sceneHTML(sc),opts:sc.opts,correct:sc.correct,hint:sc.hint,
    say:`${sc.line} ${sc.reply}`,
    sayHTML:`<div class="dialog"><p><b>${sc.who}</b>${esc(sc.line)}</p><p><b>Yo</b>${esc(sc.reply)}</p></div>`,sayPlain:sc.reply};
}
const opt=(v,label)=>({v,label});

/* topics */
function qTime(){
  const t=randTime();const ok=timeES(t);
  let d1={...t,h:t.h===11?10:t.h+1};if(timeES(d1)===ok)d1={...t,h:t.h-1};
  const d2=!t.pm?{...t,pm:true,h:Math.min(t.h,7)}:{...t,pm:false,h:Math.max(6,Math.min(t.h,11))};
  const o=[opt('ok',ok),opt('h',timeES(d1)),opt('p',timeES(d2))];
  return Q({place:'En la escuela',placeEn:'at school',who:F2,line:'¿Qué hora es?',visual:clock(t),inst:`${F2} asks the time. Look at the clock and pick your answer.`,
    opts:shuffle(o),correct:'ok',hint:v=>v==='h'?'Casi. Check the hour. Try again.':'Casi. Check a. m. or p. m.: mañana, tarde, or noche. Try again.',reply:ok});
}
function qTimeClock(){
  const t=randTime();const said=timeES(t);
  let d1={...t,m:t.m===45?30:t.m+15};let d2={...t,h:t.h===11?9:t.h+2};
  return {prompt:'¿Qué reloj es?',inst:`${F1} tells you the time. Pick the clock that matches.`,
    top:sceneHTML({place:'En el parque',placeEn:'at the park',who:F1,line:said}),
    opts:shuffle([{v:'ok',html:clock(t),cls:'clk',lab:digits(t)},{v:'m',html:clock(d1),cls:'clk',lab:digits(d1)},{v:'h',html:clock(d2),cls:'clk',lab:digits(d2)}]),correct:'ok',
    hint:v=>v==='m'?'Casi. Check the minutes. Try again.':'Casi. Check the hour. Try again.',say:said,sayHTML:`<div class="dialog"><p><b>${F1}</b>${esc(said)}</p></div>`};
}
function qNumber(){
  const n=pick([23,26,32,34,37,39,43,45,46,48,50]);const ok=num(n);
  const a=n-10>=21?n-10:n+10;const b=n%10?(n%10===9?n-1:n+1):n-2;
  return Q({place:'En la clase',placeEn:'in class',who:F1,line:'¿Qué número es?',visual:`<div class="numcard">${n}</div>`,inst:`${F1} holds up a number card. Pick your answer.`,
    opts:shuffle([opt('ok',cap(ok)+'.'),opt('t',cap(num(a))+'.'),opt('u',cap(num(b))+'.')]),correct:'ok',hint:v=>v==='t'?'Casi. Check the first digit: veinti = 20s, treinta = 30s, cuarenta = 40s. Try again.':'Casi. Check the last digit. Try again.',reply:cap(ok)+'.'});
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function qAskPrice(){
  const f=pick(FOOD);const p=prices()[0];const ok=`¿Cuánto cuesta ${f.art} ${f.w}?`;
  return Q({place:'En la tienda',placeEn:'at the store',who:F2+' (vendedor)',line:'Hola. ¿Qué quieres?',visual:pic(f.id)+`<div class="tag">$?</div>`,
    inst:'You want to know the price first. What do you ask?',opts:shuffle([opt('ok',ok),opt('t','¿Qué hora es?'),opt('c','¿Cuántos hay?')]),correct:'ok',
    hint:()=>'Casi. To ask the price, use ¿Cuánto cuesta…? Try again.',reply:ok});
}
function qHearPrice(){
  const f=pick(FOOD);const ps=prices();const p=ps[0];
  const p2=p+10<=48?p+10:p-10;const p3=p%10===9||p%10===8?p-2:p+2;
  const line=`Cuesta ${num(p)} dólares.`;
  return {prompt:'¿Cuánto cuesta?',inst:`${F2} tells you the price of ${f.art} ${f.w}. Pick the price tag.`,
    top:sceneHTML({place:'En la tienda',placeEn:'at the store',who:F2+' (vendedor)',line,visual:pic(f.id)}),
    opts:shuffle([{v:'ok',html:`<div class="tag">$${p}</div>`,lab:`$${p}`},{v:'t',html:`<div class="tag">$${p2}</div>`,lab:`$${p2}`},{v:'u',html:`<div class="tag">$${p3}</div>`,lab:`$${p3}`}]),correct:'ok',
    hint:v=>v==='t'?'Casi. Check the tens: veinti, treinta, cuarenta. Try again.':'Casi. Check the last number. Try again.',
    say:line,sayHTML:`<div class="dialog"><p><b>${F2}</b>${esc(line)}</p><p><b>Yo</b>Quiero ${f.art} ${esc(f.w)}, por favor.</p></div>`};
}
function qOcean(){
  const a=pick(SEA);const o=pick(SEA.filter(x=>x!==a));const ok=`Hay ${a.un} ${a.s}.`;
  return Q({place:'En el acuario',placeEn:'at the aquarium',who:F1,line:'¡Mira! ¿Qué hay?',visual:pic(a.id),inst:`${F1} points at an animal (¡Mira! = Look!). Pick your answer.`,
    opts:shuffle([opt('ok',ok),opt('a',`Hay ${a.un==='un'?'una':'un'} ${a.s}.`),opt('o',`Hay ${o.un} ${o.s}.`)]),correct:'ok',
    hint:v=>v==='a'?'Casi. Check un or una. Try again.':'Casi. Check the animal. Try again.',reply:ok});
}
function qCountPets(){
  const a=pick(PETS);const n=2+rnd(4);const ok=`Hay ${W[n]} ${a.p}.`;
  return Q({place:'En la tienda de mascotas',placeEn:'at the pet store',who:F2,line:`¿${a.f?'Cuántas':'Cuántos'} ${a.p} hay?`,visual:Array.from({length:n},()=>pic(a.id)).join(''),vclass:'small',
    inst:`${F2} asks how many. Count and pick your answer.`,opts:shuffle([opt('ok',ok),opt('f',`Hay ${W[n]} ${a.s}.`),opt('n',`Hay ${W[n===2?3:n-1]} ${a.p}.`)]),correct:'ok',
    hint:v=>v==='f'?'Casi. More than one: add -s. Try again.':'Casi. Count again. Try again.',reply:ok});
}
function qCountSea(){
  const a=pick(SEA);const n=2+rnd(3);const ok=`Hay ${W[n]} ${a.p}.`;
  return Q({place:'En el acuario',placeEn:'at the aquarium',who:F1,line:'¿Cuántos hay?',visual:Array.from({length:n},()=>pic(a.id)).join(''),vclass:'small',
    inst:'Count the animals. Pick your answer.',opts:shuffle([opt('ok',ok),opt('f',`Hay ${W[n]} ${a.s}.`),opt('n',`Hay ${W[n+1]} ${a.p}.`)]),correct:'ok',
    hint:v=>v==='f'?`Casi. More than one: ${a.p}. Try again.`:'Casi. Count again. Try again.',reply:ok});
}
function qSeason(){
  const s=pick(SEAS);const os=shuffle(SEAS.filter(x=>x!==s)).slice(0,2);const ok=`Es ${s.art} ${s.w}.`;
  return Q({place:'En el parque',placeEn:'at the park',who:F2,line:'¿Qué estación es?',visual:`<div class="sea ${s.id}" aria-hidden="true">${s.emo}</div>`,
    inst:'Look at the picture. Pick your answer.',opts:shuffle([opt('ok',ok),...os.map(x=>opt(x.id,`Es ${x.art} ${x.w}.`))]),correct:'ok',hint:()=>'Casi. Look at the weather in the picture. Try again.',reply:ok});
}
function qWant(){
  const f=pick(FOOD);const o=pick(FOOD.filter(x=>x!==f));const ok=`Quiero ${f.art} ${f.w}, por favor.`;
  return Q({place:'En el picnic',placeEn:'at the picnic',who:F1,line:'¿Qué quieres?',visual:pic(f.id),inst:'You want the food in the picture. Pick your answer.',
    opts:shuffle([opt('ok',ok),opt('o',`Quiero ${o.art} ${o.w}, por favor.`),opt('g','¡Gracias!')]),correct:'ok',
    hint:v=>v==='g'?'Casi. Gracias is for after you get something. To ask, use Quiero…, por favor. Try again.':'Casi. Check the food. Try again.',reply:ok});
}
function qThanks(){
  const f=pick(FOOD);
  return Q({place:'En el picnic',placeEn:'at the picnic',who:F1,line:'Aquí tienes.',visual:pic(f.id),inst:`${F1} hands you the food. What do you say?`,
    opts:shuffle([opt('ok','¡Gracias!'),opt('p','Por favor.'),opt('q','¿Qué quieres?')]),correct:'ok',hint:()=>'Casi. When someone gives you something, say gracias. Try again.',reply:'¡Gracias!'});
}
function qMiTu(){
  const s=shuffle(FOOD);const mine=[s[0],s[1]],yours=[s[2],s[3]];const f=pick(mine);
  const visual=`<div class="mini-baskets"><div class="mb mine"><h4><span class="poss">Mi</span> canasta <span class="en">(yours)</span></h4><div class="row">${mine.map(x=>pic(x.id)).join('')}</div></div><div class="mb yours"><h4><span class="poss">Tu</span> canasta <span class="en">(${F1}’s)</span></h4><div class="row">${yours.map(x=>pic(x.id)).join('')}</div></div></div>`;
  const ok=`En mi canasta hay ${f.ind} ${f.w}.`;
  return Q({place:'En el picnic',placeEn:'at the picnic',who:F1,line:'¿Qué hay en tu canasta?',visual,inst:`${F1} asks about YOUR basket. Pick your answer.`,
    opts:shuffle([opt('ok',ok),opt('tu',`En tu canasta hay ${f.ind} ${f.w}.`),opt('f',`En mi canasta hay ${yours[0].ind} ${yours[0].w}.`)]),correct:'ok',
    hint:v=>v==='tu'?'Casi. She asked about your basket, so you say mi canasta. Try again.':'Casi. Look at what is in your basket (Mi canasta). Try again.',reply:ok});
}

function buildGame(quick){
  if(quick)return [qTime(),qHearPrice(),qOcean(),qCountPets(),qSeason(),qMiTu()];
  return [qTime(),qNumber(),qAskPrice(),qOcean(),qCountPets(),qSeason(),qWant(),qHearPrice(),qCountSea(),qThanks(),qTimeClock(),qMiTu()];
}

/* ---------- shared renderer ---------- */
function renderQuestion(host,q,st,o){
  const L='ABC';
  const opts=q.opts.map((op,i)=>{
    const isOk=st.done&&op.v===q.correct,isNo=st.picked.includes(op.v)&&op.v!==q.correct;
    const lab=op.lab||op.label;
    const cls=['choice',op.cls||'',isOk?'ok':'',isNo?'no':''].join(' ');
    const mark=isOk?'<span class="mark" aria-hidden="true">✓</span>':isNo?'<span class="mark" aria-hidden="true">✗</span>':'';
    const sr=isOk?' (correct)':isNo?' (not correct)':'';
    return `<button class="${cls}" data-i="${i}" ${st.done||isNo?'disabled':''} aria-label="${L[i]}: ${esc(lab)}${sr}"><span class="k" aria-hidden="true">${L[i]}</span>${op.html||`<span>${esc(op.label)}</span>`}${mark}</button>`;}).join('');
  host.innerHTML=(o.top||'')+
    `<p class="prompt">${esc(q.prompt)}</p><p class="inst">${q.inst}</p>`+(q.top||'')+
    `<div class="choices" role="group" aria-label="Answer choices">${opts}</div>`+
    `<p class="feedback" data-role="fb" aria-live="polite"></p>`+
    `<div class="say" data-role="say"><p class="en">Now read the conversation out loud:</p><div data-role="sayw"></div>${canSpeak()?'<button class="minibtn" data-act="hear" style="margin-top:6px">🔊 Escuchar</button>':''}</div>`+
    (o.bottom||'');
  const fb=host.querySelector('[data-role="fb"]'),say=host.querySelector('[data-role="say"]');
  const showDone=()=>{fb.className='feedback ok';fb.textContent='✓ ¡Muy bien!';host.querySelector('[data-role="sayw"]').innerHTML=q.sayHTML;say.classList.add('on');};
  if(st.done)showDone();
  host.querySelector('.choices').addEventListener('click',e=>{
    const b=e.target.closest('.choice');if(!b||b.disabled||st.done)return;
    const op=q.opts[+b.dataset.i];
    if(op.v===q.correct){
      st.done=true;host.querySelectorAll('.choice').forEach(x=>x.disabled=true);
      b.classList.add('ok');b.insertAdjacentHTML('beforeend','<span class="mark" aria-hidden="true">✓</span>');
      b.setAttribute('aria-label',b.getAttribute('aria-label')+' (correct)');showDone();o.onCorrect&&o.onCorrect();
    }else{
      st.missed=true;st.picked.push(op.v);b.classList.add('no');b.disabled=true;
      b.insertAdjacentHTML('beforeend','<span class="mark" aria-hidden="true">✗</span>');
      b.setAttribute('aria-label',b.getAttribute('aria-label')+' (not correct)');
      fb.className='feedback no';fb.textContent='✗ '+q.hint(op.v);
    }
  });
  const hr=host.querySelector('[data-act="hear"]');if(hr)hr.onclick=()=>speak(q.say);
  const hb=host.querySelector('[data-act="help"]');if(hb)hb.onclick=openHelp;
}

/* ---------- PRACTICAR ---------- */
const PR={qs:[],st:[],i:0};
function newPractice(){
  PR.qs=[qTime(),qAskPrice(),qCountPets(),qWant()];
  PR.st=PR.qs.map(()=>({picked:[],done:false,missed:false}));PR.i=0;renderPractice();
}
function renderPractice(){
  const host=$('practice');
  if(PR.i>=PR.qs.length){
    host.innerHTML=`<div class="result"><p class="big">¡Listos!</p><p>You finished the practice. Go to <b>2. El desafío</b> when you’re ready.</p>
      <div class="btns" style="justify-content:center"><button class="btn" id="pAgain">Más práctica <span class="en">More practice</span></button><button class="btn main" id="pGo">2. El desafío ▶</button></div></div>`;
    $('pAgain').onclick=newPractice;$('pGo').onclick=()=>{show('jugar');history.replaceState(null,'','#jugar');};return;
  }
  const st=PR.st[PR.i];
  renderQuestion(host,PR.qs[PR.i],st,{
    top:`<div class="topline"><span class="count">Práctica ${PR.i+1} de ${PR.qs.length}</span><button class="minibtn" data-act="help">📋 Ayuda</button></div>`,
    bottom:`<div class="navrow"><button class="btn" id="pBack" ${PR.i===0?'hidden':''}>◀ Atrás <span class="en">Back</span></button><div class="right"><button class="btn turq" id="pNext" ${st.done?'':'hidden'}>Siguiente <span class="en">Next</span> ▶</button></div></div>`,
    onCorrect:()=>{const n=$('pNext');n.hidden=false;n.focus();}
  });
  $('pBack').onclick=()=>{PR.i--;renderPractice();};
  $('pNext').onclick=()=>{PR.i++;renderPractice();};
}
newPractice();

/* ---------- DESAFÍO ---------- */
const TITLE='Conversaciones en español: Quarter 2 Review';
const G={name:'',quick:false,qs:[],st:[],i:0};
function startScreen(){
  let saved='';try{saved=localStorage.getItem('clase-nombre')||'';}catch(e){}
  $('game').innerHTML=`<div class="start"><p class="prompt">El desafío de conversación 💬</p>
    <p>Short conversations from everything we learned this quarter. Pick the best reply.<br><b>No timer.</b> You can always try again. Need help? Press <b>📋 Ayuda</b> any time.</p>
    <label for="gName"><b>Nombre</b> <span class="en">First name</span></label>
    <input id="gName" autocomplete="off" maxlength="30" value="${esc(saved)}" placeholder="Type your first name">
    <div class="modes">
      <button class="mode full" data-mode="full"><b>¡Vamos!</b><span>Full review · 12 conversations</span></button>
      <button class="mode" data-mode="quick"><b>Repaso rápido</b><span>Quick review · 6 conversations</span></button>
    </div></div>`;
  $('game').querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
    G.name=$('gName').value.trim();try{localStorage.setItem('clase-nombre',G.name);}catch(e){}
    G.quick=b.dataset.mode==='quick';G.qs=buildGame(G.quick);G.st=G.qs.map(()=>({picked:[],done:false,missed:false}));G.i=0;gameQ();
  });
}
function gameQ(){
  const T=G.qs.length,st=G.st[G.i],last=G.i===T-1;
  const dots=`<div class="dots" aria-hidden="true">${G.qs.map((_,k)=>`<span class="dot ${G.st[k].done&&k!==G.i?'done':k===G.i?'cur':''}"></span>`).join('')}</div>`;
  renderQuestion($('game'),G.qs[G.i],st,{
    top:`<div class="topline"><span class="count">Conversación ${G.i+1} de ${T}</span>${dots}<button class="minibtn" data-act="help">📋 Ayuda</button></div>`,
    bottom:`<div class="navrow"><button class="btn" id="gBack" ${G.i===0?'hidden':''}>◀ Atrás <span class="en">Back</span></button><div class="right"><button class="btn turq" id="gNext" ${st.done?'':'hidden'}>${last?'Terminar <span class="en">Finish</span>':'Siguiente <span class="en">Next</span>'} ▶</button></div></div>`,
    onCorrect:()=>{const n=$('gNext');n.hidden=false;n.focus();}
  });
  $('gBack').onclick=()=>{G.i--;gameQ();};
  $('gNext').onclick=()=>{if(last)finish();else{G.i++;gameQ();}};
}
function finish(){
  const T=G.qs.length,done=G.st.filter(s=>s.done).length,first=G.st.filter(s=>s.done&&!s.missed).length;
  const date=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const status=done===T?'Completed':'In progress';
  const mode=G.quick?'Quick review (6)':'Full review (12)';
  const text=`${TITLE}\nName: ${G.name||'(no name)'}\nDate: ${date}\nMode: ${mode}\nConversations completed: ${done} of ${T}\nCorrect on first try: ${first}\nStatus: ${status}`;
  $('game').innerHTML=`<div class="result"><p class="prompt">¡Terminaste! 🌟</p>
    <p class="big">¡Buen trabajo, ${esc(G.name||'amigo')}!</p>
    <p>You finished all ${T} conversations. Look at how much Spanish you used this quarter.</p>
    <div class="summary"><dl>
      <dt>Activity</dt><dd>${esc(TITLE)}</dd>
      <dt>Name</dt><dd>${esc(G.name||'(no name)')}</dd>
      <dt>Date</dt><dd>${esc(date)}</dd>
      <dt>Mode</dt><dd>${mode}</dd>
      <dt>Completed</dt><dd>${done} of ${T} conversations</dd>
      <dt>First try</dt><dd>${first} correct on the first try</dd>
      <dt>Status</dt><dd>${status==='Completed'?'✓ ':''}${status}</dd>
    </dl></div>
    <p class="note">Press <b>Copy Results</b>, then paste it into the Teams assignment or chat.</p>
    <div class="btns" style="justify-content:center">
      <button class="btn main" id="gCopy">📋 Copy Results</button>
      <button class="btn" id="gReview">◀ Review my answers</button>
      <button class="btn" id="gAgain">Practicar otra vez <span class="en">Practice again</span></button>
    </div>
    <p class="feedback" id="copyFb" aria-live="polite"></p>
    <textarea id="copyBox" readonly hidden aria-label="Results text"></textarea></div>`;
  $('gCopy').onclick=async()=>{
    const fb=$('copyFb');
    try{await navigator.clipboard.writeText(text);fb.className='feedback ok';fb.textContent='✓ Copied! Now paste it into Teams (Ctrl + V).';}
    catch(e){
      const box=$('copyBox');box.hidden=false;box.value=text;box.focus();box.select();
      let ok=false;try{ok=document.execCommand('copy');}catch(_){}
      fb.className='feedback '+(ok?'ok':'no');
      fb.textContent=ok?'✓ Copied! Now paste it into Teams (Ctrl + V).':'Copy the text in the box below (Ctrl + C), then paste it into Teams.';
    }
  };
  $('gReview').onclick=()=>{G.i=0;gameQ();};
  $('gAgain').onclick=startScreen;
}
startScreen();

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||dlg.open)return;
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  const i={'1':0,'2':1,'3':2,a:0,b:1,c:2}[e.key.toLowerCase()];if(i==null)return;
  const host=current==='practicar'?$('practice'):current==='jugar'?$('game'):null;if(!host)return;
  const btn=host.querySelectorAll('.choice')[i];if(btn&&!btn.disabled){btn.click();e.preventDefault();}
});
})();
