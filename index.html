<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Spanish 7/8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#14284B; --muted:#55657F; --line:#D3DCEA;
  --cobalt:#1D4E89; --on-cobalt:#FFFFFF; --saffron:#F2B705; --on-saffron:#2A1E00; --mint:#2E9A87;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E192C; --surface:#172540; --ink:#EAF0FA; --muted:#A3B4CE; --line:#2A3C5D; --cobalt:#86AEE6; --on-cobalt:#0E192C; --mint:#5CC9B5; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0E192C; --surface:#172540; --ink:#EAF0FA; --muted:#A3B4CE; --line:#2A3C5D; --cobalt:#86AEE6; --on-cobalt:#0E192C; --mint:#5CC9B5; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:1.15rem; line-height:1.5}
.wrap{max-width:820px; margin:0 auto; padding:2rem clamp(1rem,4vw,2rem) 3rem}

.hero{display:flex; align-items:center; gap:1rem; margin-bottom:.5rem}
.badge{flex:none; width:4.2rem; height:4.2rem; border-radius:50%; background:var(--saffron); color:var(--on-saffron); display:grid; place-items:center; font-family:var(--display); font-size:1.6rem; line-height:1; box-shadow:inset 0 0 0 5px var(--surface), 0 0 0 3px var(--cobalt)}
h1{font-family:var(--display); font-size:clamp(2.4rem,8vw,3.4rem); line-height:1; margin:0}
.sub{color:var(--muted); margin:.5rem 0 2rem}
.tip{background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:.7rem 1rem; color:var(--muted); font-size:1rem; margin-bottom:1.5rem}

.week{background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:1.25rem 1.5rem; margin-bottom:1rem}
.week.current{border-color:var(--cobalt); border-width:3px}
.label{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:.2rem}
.num{font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-size:.9rem}
.now{background:var(--mint); color:#fff; font-weight:700; font-size:.85rem; padding:.1rem .6rem; border-radius:999px}
.week h2{font-family:var(--display); font-size:clamp(1.6rem,5vw,2rem); margin:0; line-height:1.1}
.week p{margin:.2rem 0 1rem; color:var(--muted)}
.links{display:flex; flex-wrap:wrap; gap:.75rem}
a.btn{display:inline-flex; align-items:center; gap:.5rem; text-decoration:none; font-weight:700; border-radius:14px; padding:.8rem 1.3rem}
a.primary{background:var(--cobalt); color:var(--on-cobalt)}
a.secondary{border:2px solid var(--line); color:var(--ink)}
a.btn small{font-weight:400; opacity:.85}
a:focus-visible{outline:3px solid var(--saffron); outline-offset:3px}
h3{font-family:var(--display); font-size:1.4rem; margin:2rem 0 .75rem; color:var(--muted)}
footer{margin-top:2.5rem; color:var(--muted); font-size:.95rem}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <div class="badge" aria-hidden="true">7/8</div>
    <h1>Spanish 7/8</h1>
  </div>
  <p class="sub">Juegos de español <span lang="en">(Spanish games)</span></p>
  <p class="tip">🔊 Turn on your sound before you start.</p>

  <div id="weeks"></div>

  <footer>¡Buena suerte! <span lang="en">(Good luck!)</span></footer>
</main>

<script>
/* ===== ADD NEW WEEKS HERE =====
   Copy one { ... } block, paste it at the TOP of the list, and change the text.
   The first week in the list is shown as "This week". */
const WEEKS = [
  {
    week: 8,
    title: "¿Qué hora es?",
    english: "What time is it? Telling time to the hour",
    games: [
      { icon: "⏰", label: "Classwork",      english: "Turn in on Teams", file: "week8-que-hora-es.html",    main: true },
      { icon: "🕒", label: "Practice clock", english: "Explore and listen", file: "week8-practice-clock.html" }
    ]
  }
];
/* ===== END OF WEEK LIST ===== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const card = (w, current) => `
  <section class="week${current ? " current" : ""}">
    <div class="label"><span class="num">Semana ${esc(w.week)} · Week ${esc(w.week)}</span>${current ? '<span class="now">This week</span>' : ""}</div>
    <h2>${esc(w.title)}</h2>
    <p>${esc(w.english)}</p>
    <div class="links">${w.games.map(g => `<a class="btn ${g.main ? "primary" : "secondary"}" href="${esc(g.file)}">${esc(g.icon)} ${esc(g.label)} <small>${esc(g.english || "")}</small></a>`).join("")}</div>
  </section>`;
const el = document.getElementById("weeks");
el.innerHTML = WEEKS.length
  ? card(WEEKS[0], true) + (WEEKS.length > 1 ? `<h3>Semanas anteriores <span lang="en" style="font-family:var(--body);font-size:.75em">(Past weeks)</span></h3>` + WEEKS.slice(1).map(w => card(w, false)).join("") : "")
  : "<p>No games yet.</p>";
</script>
</body>
</html>
